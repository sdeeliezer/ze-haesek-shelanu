<title>שדה אליעזר - זה העסק שלנו</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style id="se-style">
/* Layout: a green "field" hero band with the two logos and the wordmark; a search + category strip; a responsive grid of business cards; an editors-only management panel above the grid. */
:root {
  --bg: #f4f6f0;
  --surface: #ffffff;
  --fg: #1d281a;
  --muted: #5a6654;
  --line: #d6ddcf;
  --accent: #3f6b2a;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebd7;
  --hero: #2f5320;
  --hero-ink: #f4f8ee;
  --hero-soft: rgba(255,255,255,.14);
  --wheat: #c8962e;
  --wheat-soft: #f6ebcf;
  --wheat-ink: #5c4210;
  --danger: #b23b2e;
  --focus: #2f6fb3;
  --display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --body: "Assistant", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131911; --surface: #1c2419; --fg: #e7eee1; --muted: #a2ad9a; --line: #33402e;
    --accent: #8fc06f; --accent-ink: #132010; --accent-soft: #253420;
    --hero: #1f3417; --hero-ink: #eef5e6; --hero-soft: rgba(255,255,255,.10);
    --wheat: #e0b453; --wheat-soft: #3a2f16; --wheat-ink: #f3d793; --danger: #ef7b6c; --focus: #79b0ee;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131911; --surface: #1c2419; --fg: #e7eee1; --muted: #a2ad9a; --line: #33402e;
  --accent: #8fc06f; --accent-ink: #132010; --accent-soft: #253420;
  --hero: #1f3417; --hero-ink: #eef5e6; --hero-soft: rgba(255,255,255,.10);
  --wheat: #e0b453; --wheat-soft: #3a2f16; --wheat-ink: #f3d793; --danger: #ef7b6c; --focus: #79b0ee;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16.5px; line-height: 1.55; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1120px; margin: 0 auto; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }

/* hero */
.hero { background: var(--hero); color: var(--hero-ink); position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 46px; pointer-events: none;
  background: repeating-linear-gradient(100deg, var(--hero-soft) 0 22px, transparent 22px 40px);
}
.hero .inner { padding-block: 26px 74px; display: flex; flex-direction: column; gap: 22px; position: relative; z-index: 1; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.moshav { display: flex; align-items: center; gap: 12px; }
.moshav-logo {
  width: 64px; height: 64px; border-radius: 50%; background: var(--surface); display: grid; place-items: center;
  overflow: hidden; flex: none; border: 3px solid var(--hero-soft);
}
.moshav-logo img { width: 100%; height: 100%; object-fit: contain; }
/* An uploaded logo is usually wide, so it gets a rounded white plate instead of the circle */
.moshav-logo.has-img { width: auto; height: 80px; box-sizing: border-box; border-radius: 14px; padding: 6px 12px; background: #fff; }
.moshav-logo.has-img img { height: 66px; width: auto; max-width: none; }
.moshav-logo .ph { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 12px; text-align: center; line-height: 1.15; padding: 6px; }
.moshav-name { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.moshav-name small { display: block; font-family: var(--body); font-weight: 400; opacity: .8; font-size: 13.5px; }
.hero-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
@media (max-width: 720px) { .hero-main { grid-template-columns: 1fr; } }
.wordmark { display: flex; align-items: center; gap: 16px; }
.wordmark svg { width: clamp(64px, 12vw, 96px); height: auto; flex: none; }
.wordmark h1 { font-size: clamp(38px, 8vw, 72px); font-weight: 800; line-height: 1; letter-spacing: -.01em; }
.wordmark h1 span { color: var(--wheat); }
.brand-img { max-height: 120px; max-width: min(360px, 100%); object-fit: contain; display: block; }
.hero-sub { margin: 12px 0 0; font-size: clamp(17px, 2.4vw, 20px); max-width: 52ch; opacity: .92; }
.hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--hero-soft); border-radius: 12px; padding: 10px 16px; min-width: 110px; }
.stat b { display: block; font-family: var(--display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; opacity: .85; }
.btn {
  font: inherit; font-weight: 700; border-radius: 10px; padding: 10px 16px; cursor: pointer; text-decoration: none;
  border: 1px solid var(--accent); background: var(--surface); color: var(--accent); display: inline-flex; align-items: center; gap: 6px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.wheat { background: var(--wheat); border-color: var(--wheat); color: #1f1a0e; }
.btn.small { padding: 6px 10px; font-size: 14px; font-weight: 600; }
/* the main call to action: big, high-contrast, sits under the hero intro */
.btn.cta {
  margin-top: 20px; padding: 16px 34px; font-size: 21px; font-weight: 700; border-radius: 16px;
  font-family: var(--display); gap: 10px; box-shadow: 0 8px 22px rgba(0,0,0,.28);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn.cta:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.32); }
.btn.cta .plus { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #1f1a0e; color: var(--wheat); font-size: 22px; line-height: 1; }
@media (max-width: 560px) { .btn.cta { display: flex; justify-content: center; width: 100%; box-sizing: border-box; } }
.admin-entry { margin-top: 12px; }
.btn.ghost { border-color: var(--line); color: var(--muted); background: transparent; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn[disabled] { opacity: .55; cursor: default; }
.hero .btn.ghost { color: var(--hero-ink); border-color: var(--hero-soft); }

/* toolbar */
.toolbar { margin-top: -30px; position: relative; z-index: 2; }
.toolbar .box {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(20,40,10,.08);
}
.search { display: flex; gap: 10px; }
.search input {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 14.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .n { opacity: .7; font-variant-numeric: tabular-nums; }
.chip.zero { opacity: .55; }
.src-tag { align-self: flex-start; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.chip.zero[aria-pressed="true"] { opacity: 1; }
.cat-label { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--muted); margin-top: 4px; }
.chips.pick .chip { font-weight: 400; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.chips.pick .chip input { margin: 0; accent-color: var(--accent); }
.chips.pick .chip:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lbl { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }

main .inner { padding-block: 26px 40px; display: flex; flex-direction: column; gap: 22px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; font: inherit; font-weight: 700; font-size: 15px; border: 0; border-radius: 9px; padding: 8px 12px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(20,40,10,.15); }
.seg .n { opacity: .65; font-variant-numeric: tabular-nums; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group-head { display: flex; align-items: center; gap: 10px; }
.group-head h2 { font-size: 24px; }
.group-head .n { font-family: var(--display); font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; }
.g-exp .group-head .n { background: var(--wheat-soft); color: var(--wheat-ink); }
.g-exp { padding-top: 10px; }
.card.exp { border-color: var(--wheat); }
.card.exp .mono { color: var(--wheat-ink); background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(200,150,46,.12) 22px 40px), var(--wheat-soft); }
.card.exp .cat { color: var(--wheat-ink); }
.perk.vol { background: var(--accent); color: var(--accent-ink); }
.offers { display: flex; flex-wrap: wrap; gap: 6px; }
.offers span { font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--wheat-soft); color: var(--wheat-ink); }
.result-line { color: var(--muted); font-size: 15px; margin: 0; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
@media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
.media { aspect-ratio: 16 / 10; background: var(--accent-soft); position: relative; max-width: 100%; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mono {
  width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--display); font-weight: 800;
  font-size: 64px; color: var(--accent);
  background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(63,107,42,.08) 22px 40px), var(--accent-soft);
}
.perk {
  position: absolute; top: 10px; inset-inline-start: 10px; background: var(--wheat); color: #1f1a0e;
  font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px;
}
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.sample-tag { align-self: flex-start; font-size: 12.5px; font-weight: 700; color: var(--danger); border: 1px dashed var(--danger); border-radius: 6px; padding: 1px 8px; }
.cat { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .02em; }
.card h3 { font-size: 21px; line-height: 1.2; }
.prof { color: var(--muted); font-size: 15px; margin-top: -4px; }
.desc { margin: 0; }
.perk-text { background: var(--wheat-soft); color: var(--wheat-ink); border-radius: 8px; padding: 6px 10px; font-size: 14.5px; font-weight: 600; }
.svc-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.svc-list li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.svc-list .p { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta { display: flex; flex-direction: column; gap: 3px; font-size: 14.5px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 600; }
.contact { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.phone-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.phone { font-family: var(--display); font-weight: 600; font-size: 19px; direction: ltr; unicode-bidi: isolate; user-select: all; font-variant-numeric: tabular-nums; }
.links { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14.5px; }
.links .ltr { direction: ltr; unicode-bidi: isolate; word-break: break-all; }
details.more { border-top: 1px solid var(--line); padding-top: 8px; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: 15px; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; max-width: 100%; }
.admin-row { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 10px 18px; background: var(--bg); }

/* empty + join */
.empty {
  border: 2px dashed var(--line); border-radius: 16px; padding: 36px 20px; text-align: center;
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.empty h2 { font-size: 24px; }
.empty p { margin: 0; color: var(--muted); max-width: 48ch; }
.join {
  background: var(--accent-soft); border-radius: 16px; padding: 22px; display: flex; gap: 16px;
  align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.join h2 { font-size: 22px; }
.growing {
  display: flex; gap: 12px; align-items: flex-start; background: var(--wheat-soft); color: var(--wheat-ink);
  border: 1px solid var(--wheat); border-radius: 14px; padding: 14px 16px;
}
.growing .ic { font-size: 22px; line-height: 1.3; }
.growing p { margin: 0; font-size: 16px; }
.growing a { color: var(--wheat-ink); font-weight: 700; }
.join p { margin: 4px 0 0; color: var(--muted); }
footer { color: var(--muted); font-size: 14px; text-align: center; padding-block: 0 32px; }

/* admin panel */
.panel { background: var(--surface); border: 2px solid var(--wheat); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-size: 20px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f label { font-weight: 600; font-size: 14.5px; }
.f input, .f select, .f textarea {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 11px; width: 100%;
}
.f textarea { min-height: 90px; resize: vertical; }
.hint { font-size: 13.5px; color: var(--muted); }
.note { background: var(--wheat-soft); color: var(--wheat-ink); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
.status { font-weight: 600; color: var(--accent); }
.status.err { color: var(--danger); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 88px; height: 88px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--surface); color: var(--fg); cursor: pointer; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.logo-prev { width: 72px; height: 72px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; overflow: hidden; }
.logo-prev img { width: 100%; height: 100%; object-fit: contain; }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s ease; } .card:hover { transform: translateY(-2px); } }
</style>

  const roofSvg = `<svg viewBox="0 0 96 84" aria-hidden="true"><path d="M6 44 L48 8 L90 44" fill="none" stroke="var(--wheat)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 40 V76 H76 V40" fill="none" stroke="var(--hero-ink)" stroke-width="6" stroke-linejoin="round"/><path d="M48 76 V52" stroke="var(--hero-ink)" stroke-width="5" stroke-linecap="round"/><path d="M48 60 C40 58 37 52 38 46 C45 47 48 52 48 60 Z M48 56 C56 54 59 48 58 42 C51 43 48 48 48 56 Z" fill="var(--wheat)"/></svg>`;

  function heroHtml() {
    const s = DATA.site, n = DATA.businesses.filter(b => !isExp(b)).length;
    const nExp = DATA.businesses.filter(isExp).length;
    const moshavLogo = s.moshavLogo ? `<img src="${esc(s.moshavLogo)}" alt="לוגו מושב שדה אליעזר">` : `<span class="ph">שדה<br>אליעזר</span>`;

      </div>
      <div class="hero-main">
        <div>${brand}<p class="hero-sub">${esc(s.intro)}</p>
          ${s.formUrl ? `<a class="btn wheat cta" href="${esc(hrefSafe(s.formUrl))}" target="_blank" rel="noopener"><span class="plus" aria-hidden="true">+</span>הצטרפות למאגר</a>` : ""}</div>
        <div class="hero-stats"><div class="stat"><b>${n}</b><span>עסקים ובעלי מקצוע</span></div><div class="stat exp"><b>${nExp}</b><span>אנשי מומחיות</span></div></div>
      </div>
    </div></header>`;
  }

  function toolbarHtml() {
    const counts = {};
    const pool = DATA.businesses.filter(b => !ui.kind || b.kind === ui.kind);
    pool.forEach(b => catsOf(b).forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
    // Always show the full, ordered category lists (empty ones dimmed). "הכול" shows both lists under their own labels.
    const groups = ui.kind === "biz" ? [["", CATEGORIES]] : ui.kind === "expert" ? [["", EXP_CATEGORIES]]
      : [["תחומי עסקים ובעלי מקצוע", CATEGORIES], ["תחומי מומחיות", EXP_CATEGORIES]];
    const listed = new Set(groups.flatMap(g => g[1]));
    const extra = Object.keys(counts).filter(c => !listed.has(c)); // custom categories typed under "אחר"
    if (extra.length) groups[groups.length - 1] = [groups[groups.length - 1][0], [...groups[groups.length - 1][1], ...extra]];
    const chip = c => `<button type="button" class="chip${counts[c] || !pool.length ? "" : " zero"}" data-cat="${esc(c)}" aria-pressed="${ui.cat === c}">${esc(c)} <span class="n">${counts[c] || 0}</span></button>`;
    const nB = DATA.businesses.filter(b => !isExp(b)).length, nE = DATA.businesses.length - nB;
    // While the registry is still small (and not empty: the empty state says it), tell visitors it has just
    // opened and fills up as people register. Sits at the top so it is seen before the long category list.
    const n = DATA.businesses.length;
    const growing = n > 0 && n < 20 ? `<div class="growing" role="note"><span class="ic" aria-hidden="true">🌱</span><p><b>ההרשמה רק נפתחה!</b> המאגר מתעדכן כל הזמן, וכרטיסי העסקים עולים לאתר עם כל הרשמה חדשה. חזרו לבקר בקרוב${DATA.site.formUrl ? `, ואם יש לכם עסק, מקצוע או כישרון, <a href="${esc(hrefSafe(DATA.site.formUrl))}" target="_blank" rel="noopener">הירשמו עכשיו והיו מהראשונים</a>` : ""}.</p></div>` : "";
    return `<div class="toolbar gutter"><div class="inner"><div class="box">
      ${growing}
      <div class="seg" role="group" aria-label="מה מחפשים">
        <button type="button" data-kind="" aria-pressed="${!ui.kind}">הכול</button>
        <button type="button" data-kind="biz" aria-pressed="${ui.kind === "biz"}">עסקים ובעלי מקצוע <span class="n">${nB}</span></button>
        <button type="button" data-kind="expert" aria-pressed="${ui.kind === "expert"}">אנשי מומחיות <span class="n">${nE}</span></button>
      </div>
      <div class="search"><input id="q" type="search" placeholder="חיפוש: חשמלאי, עוגות, ריתוך, מחשבים…" aria-label="חיפוש במאגר" value="${esc(ui.q)}"></div>
      <div class="chips" role="group" aria-label="סינון לפי תחום">
        <button type="button" class="chip" data-cat="" aria-pressed="${!ui.cat}">כל התחומים <span class="n">${pool.length}</span></button>
      </div>
      ${groups.map(([label, list]) => `${label ? `<div class="cat-label">${label}</div>` : ""}
        <div class="chips" role="group" aria-label="${label || "סינון לפי תחום"}">${list.map(chip).join("")}</div>`).join("")}
    </div></div></div>`;
  }

  function cardHtml(b) {
    const exp = isExp(b);
    const first = b.photos && b.photos[0];
    const media = first ? `<img src="${esc(first)}" alt="${esc(b.bizName)}" loading="lazy">` : `<div class="mono" aria-hidden="true">${esc((b.bizName || "?").trim().charAt(0))}</div>`;
    const svcs = (b.services || []).filter(s => s.name);
    const svcHtml = svcs.length ? `<ul class="svc-list">${svcs.map(s => `<li><span>${esc(s.name)}</span><span class="p">${esc(b.showPrices && s.price ? s.price : (b.showPrices ? "" : "לפי הצעת מחיר"))}</span></li>`).join("")}</ul>` : "";
    const wa = waNumber(b.phone);
    const isUrl = s => /^(https?:\/\/|www\.|[\w-]+\.[a-z]{2,})/i.test(s || "");
    const site = hrefSafe(b.website), social = hrefSafe(isUrl(b.social) ? b.social : "");
    // Instagram: accept a link, or an @handle / bare handle and build the profile link
    const ig = (b.instagram || "").trim();
    const igHref = isUrl(ig) ? hrefSafe(ig) : (/^@?[\w.]{2,30}$/.test(ig) ? "https://www.instagram.com/" + ig.replace(/^@/, "") : "");
    const meta = [
      b.bizAddress && `<span><b>כתובת העסק:</b> ${esc(b.bizAddress)} · <a href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(b.bizAddress)}" target="_blank" rel="noopener">במפה</a></span>`,
      b.availability && `<span><b>זמינות:</b> ${esc(b.availability)}</span>`,
      b.tools && `<span><b>ציוד:</b> ${esc(b.tools)}</span>`,
      b.area && `<span><b>אזור שירות:</b> ${esc(b.area)}</span>`,
      b.hours && `<span><b>שעות:</b> ${esc(b.hours)}</span>`
    ].filter(Boolean).join("");
    const more = [
      !exp && b.ownerName && `<span><b>בעל/ת העסק:</b> ${esc(b.ownerName)}</span>`,
      b.years && `<span><b>שנות ניסיון:</b> ${esc(b.years)}</span>`,
      b.license && `<span><b>רישיון / הסמכה:</b> ${esc(b.license)}</span>`,
      b.location && `<span><b>איפה:</b> ${esc(b.location)}</span>`,
      b.farmNo && `<span><b>כתובת במושב:</b> ${esc(b.farmNo)}</span>`,
      b.contactPref && `<span><b>התקשרות מועדפת:</b> ${esc(b.contactPref)}</span>`
    ].filter(Boolean).join("");
    const gallery = (b.photos || []).length > 1 ? `<div class="gallery">${b.photos.slice(1).map(p => `<img src="${esc(p)}" alt="" loading="lazy">`).join("")}</div>` : "";
    const admin = ui.admin ? `<div class="admin-row">
      <button type="button" class="btn small" data-edit="${esc(b.id)}">עריכה</button>
      ${ui.confirmDel === b.id
        ? `<button type="button" class="btn small danger" data-del-yes="${esc(b.id)}">להסיר מהמאגר?</button><button type="button" class="btn small ghost" data-del-no>ביטול</button>`
        : `<button type="button" class="btn small danger" data-del="${esc(b.id)}">הסרה</button>`}
    </div>` : "";
    const vol = exp && /התנדבות|קהילתיים/.test(b.offer || "");
    const offers = exp && b.offer ? `<div class="offers">${b.offer.split(/,\s*/).filter(Boolean).map(o => `<span>${esc(o)}</span>`).join("")}</div>` : "";
    return `<article class="card${exp ? " exp" : ""}">
      <div class="media">${media}${vol ? `<span class="perk vol">מוכן/ה להתנדב</span>` : (b.discount ? `<span class="perk">הטבה לתושבים</span>` : "")}</div>
      <div class="card-body">
        ${b.sample ? `<div class="sample-tag">עסק לדוגמה · לא אמיתי</div>` : ""}
        ${b.source === "google" ? `<div class="src-tag">מתוך Google Maps · טרם אושר ע״י בעל/ת העסק</div>` : ""}
        ${catsOf(b).length ? `<div class="cat">${catsOf(b).map(esc).join(" · ")}</div>` : ""}
        <h3>${esc(b.bizName)}</h3>
        ${exp ? ((b.ownerName || b.profession) ? `<div class="prof">${esc([b.ownerName, b.profession].filter(Boolean).join(" · "))}</div>` : "")
              : (b.profession ? `<div class="prof">${esc(b.profession)}</div>` : "")}
        ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ""}
        ${offers}
        ${b.discount ? `<div class="perk-text">${esc(discountText(b.discount))}</div>` : ""}
        ${svcHtml}
        ${meta ? `<div class="meta">${meta}</div>` : ""}
        ${(more || gallery) ? `<details class="more"><summary>עוד פרטים${gallery ? " ותמונות" : ""}</summary><div class="meta" style="margin-top:6px">${more}</div>${gallery}</details>` : ""}
        <div class="contact">
          ${b.phone ? `<div class="phone-row"><span class="phone">${esc(b.phone)}</span>
            <button type="button" class="btn small ghost" data-copy="${esc(b.phone)}">העתקה</button>
            ${wa ? `<a class="btn small primary" href="https://wa.me/${wa}" target="_blank" rel="noopener">וואטסאפ</a>` : ""}</div>` : ""}
          ${b.phone2 ? `<div class="links">טלפון נוסף: <span class="ltr">${esc(b.phone2)}</span></div>` : ""}
          <div class="links">
            ${b.email ? `<span class="ltr">${esc(b.email)}</span>` : ""}
            ${site ? `<a href="${esc(site)}" target="_blank" rel="noopener">לאתר</a>` : ""}
            ${social ? `<a href="${esc(social)}" target="_blank" rel="noopener">פייסבוק</a>` : (b.social ? `<span>פייסבוק: ${esc(b.social)}</span>` : "")}
            ${igHref ? `<a href="${esc(igHref)}" target="_blank" rel="noopener">אינסטגרם</a>` : (ig ? `<span>אינסטגרם: <span class="ltr">${esc(ig)}</span></span>` : "")}
            ${b.otherContact ? (isUrl(b.otherContact) ? `<a href="${esc(hrefSafe(b.otherContact))}" target="_blank" rel="noopener">קישור נוסף</a>` : `<span>${esc(b.otherContact)}</span>`) : ""}
          </div>
        </div>
      </div>${admin}
    </article>`;
  }

  function filtered() {
    const q = ui.q.trim().toLowerCase();
    return DATA.businesses.filter(b => {
      if (ui.kind && b.kind !== ui.kind) return false;
      if (ui.cat && !catsOf(b).includes(ui.cat)) return false;
      if (!q) return true;
      const hay = [b.bizName, b.profession, ...catsOf(b), b.description, b.ownerName, b.offer, b.tools, ...(b.services || []).map(s => s.name)].join(" ").toLowerCase();
      return q.split(/\s+/).every(w => hay.includes(w));
    }).sort((a, b) => (a.bizName || "").localeCompare(b.bizName || "", "he"));
  }

  function listHtml() {
    if (!DATA.businesses.length) {
      return `<div class="empty"><h2>ההרשמה רק נפתחה!</h2><p>המאגר מתעדכן כל הזמן, וכרטיסי העסקים עולים לאתר עם כל הרשמה חדשה. יש לך עסק, מקצוע או כישרון? הירשמו עכשיו והיו מהראשונים.</p>
        ${DATA.site.formUrl ? `<a class="btn primary" href="${esc(hrefSafe(DATA.site.formUrl))}" target="_blank" rel="noopener">לטופס ההרשמה</a>` : ""}</div>`;
    }
    const list = filtered();
    if (!list.length) return `<div class="empty"><h2>לא נמצאו תוצאות</h2><p>נסו מילת חיפוש אחרת או בחרו ״הכול״.</p></div>`;
    const bizList = list.filter(b => !isExp(b)), expList = list.filter(isExp);
    const block = (title, sub, items, cls) => items.length ? `<section class="group ${cls}">
        <div class="group-head"><h2>${title}</h2><span class="n">${items.length}</span></div>
        <p class="result-line">${sub}</p>
        <div class="grid">${items.map(cardHtml).join("")}</div></section>` : "";
    return block("עסקים ובעלי מקצוע", "שירותים ומוצרים של תושבי המושב", bizList, "g-biz")
      + block("אנשי מומחיות", "שכנים עם תחביב, כישרון או ידע, שישמחו לייעץ, ללמד ולעזור", expList, "g-exp");
  }

  function joinHtml() {
    if (!DATA.businesses.length || !DATA.site.formUrl) return "";
    return `<section class="join"><div><h2>גם לך יש עסק, תחביב או כישרון?</h2><p>ההרשמה למאגר פתוחה לכל תושבי שדה אליעזר וללא עלות, לבעלי עסקים ולאנשי מומחיות.</p></div>
      <a class="btn primary" href="${esc(hrefSafe(DATA.site.formUrl))}" target="_blank" rel="noopener">לטופס ההרשמה</a></section>`;
  }

  // ---------- admin panel ----------
  function field(id, label, val, opts = {}) {
    const cls = opts.full ? "f full" : "f";
    if (opts.type === "textarea") return `<div class="${cls}"><label for="${id}">${label}</label><textarea id="${id}">${esc(val)}</textarea>${opts.hint ? `<span class="hint">${opts.hint}</span>` : ""}</div>`;
    if (opts.type === "select") return `<div class="${cls}"><label for="${id}">${label}</label><select id="${id}"><option value="">בחירה…</option>${opts.options.map(o => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
    return `<div class="${cls}"><label for="${id}">${label}</label><input id="${id}" type="text" value="${esc(val)}">${opts.hint ? `<span class="hint">${opts.hint}</span>` : ""}</div>`;
  }

    const base = b.kind === "expert" ? EXP_CATEGORIES : CATEGORIES;

    return `<div class="form-grid" id="editor" data-bid="${esc(b.id)}">
      ${e.hidden && e.hidden.length ? `<div class="note full">לפי בחירת בעל/ת העסק, הפרטים האלה לא יפורסמו והושמטו: ${esc(e.hidden.join(", "))}.</div>` : ""}

      </div></div>
      ${field("e_ownerName", "שם בעל/ת העסק", b.ownerName)}

      ${b.kind === "expert" ? `
      ${field("e_offer", "במה ישמח/תשמח לעזור", b.offer, { full: true, hint: "מופרד בפסיקים, לדוגמה: עצה או טיפ בטלפון, עזרה בהתנדבות לשכנים" })}
      ${field("e_availability", "זמינות", b.availability)}
      ${field("e_tools", "ציוד או כלים", b.tools)}` : ""}
      ${field("e_services", "שירותים ומחירים", (b.services || []).map(s => s.price ? `${s.name} – ${s.price}` : s.name).join("\n"), { type: "textarea", full: true, hint: "שירות אחד בכל שורה. מחיר אחרי מקף: ״התקנת מזגן – 350 ₪ לעבודה״" })}
      <div class="f full"><label><input type="checkbox" id="e_showPrices"${b.showPrices ? " checked" : ""}> להציג מחירים בכרטיס</label></div>
      ${b.source === "google" ? `<div class="f full"><label><input type="checkbox" id="e_approved"> בעל/ת העסק אישר/ה את הפרסום (מסיר את התג "מתוך Google Maps")</label></div>` : ""}

      ${field("e_website", "אתר", b.website)}
      ${field("e_social", "פייסבוק", b.social)}
      ${field("e_instagram", "אינסטגרם", b.instagram || "")}
      ${field("e_otherContact", "אחר", b.otherContact || "")}
      ${field("e_area", "אזור שירות", b.area)}
      ${field("e_hours", "שעות פעילות", b.hours)}

        <button type="button" class="btn ghost" id="cancelEdit">ביטול</button>
      </div>
    </div>`;
  }
  function panelHtml() {

    const s = DATA.site;

        <label class="btn small" for="moshavLogoFile">העלאת לוגו</label><input id="moshavLogoFile" type="file" accept="image/*" hidden>
        ${s.moshavLogo ? `<button type="button" class="btn small ghost" data-clearlogo="moshavLogo">הסרה</button>` : ""}</div></div>
      <div class="f"><span style="font-weight:600;font-size:14.5px">לוגו ״זה העסק שלנו״</span>
        <div class="row"><div class="logo-prev">${s.brandLogo ? `<img src="${esc(s.brandLogo)}" alt="">` : ""}</div>
        <label class="btn small" for="brandLogoFile">העלאת לוגו</label><input id="brandLogoFile" type="file" accept="image/*" hidden>
        ${s.brandLogo ? `<button type="button" class="btn small ghost" data-clearlogo="brandLogo">חזרה לסמל המעוצב</button>` : ""}</div>
        <span class="hint">בלי קובץ, הדף מציג את הסמל המעוצב שבראש הדף.</span></div>
      ${field("s_intro", "משפט פתיחה", s.intro, { type: "textarea", full: true })}
      ${field("s_formUrl", "קישור לטופס ההרשמה", s.formUrl, { full: true })}
      <div class="row full"><button type="button" class="btn primary" id="saveSettings"${ui.busy ? " disabled" : ""}>שמירה ופרסום</button></div>
    </div>`;
    return `<section class="panel" aria-label="ניהול המאגר">
      <div class="row" style="justify-content:space-between"><h2>ניהול המאגר</h2><span class="hint">רק עורכי הדף רואים את החלק הזה</span></div>
      <div class="tabs">
        <button type="button" class="chip" data-tab="add" aria-pressed="${ui.tab === "add"}">${ui.editing && !ui.editing.isNew ? "עריכת עסק" : "הוספת עסק"}</button>
        <button type="button" class="chip" data-tab="settings" aria-pressed="${ui.tab === "settings"}">לוגו והגדרות</button>
      </div>
      ${ui.tab === "add" ? addTab : settingsTab}
      <div id="status" class="status${ui.statusErr ? " err" : ""}" aria-live="polite">${esc(ui.status)}</div>
    </section>`;
  }

  function render() {
    const focusId = document.activeElement && document.activeElement.id;
    const caret = focusId === "q" ? document.activeElement.selectionStart : null;
    // keep unsaved editor input across re-renders
    const ed = document.getElementById("editor");
    if (ui.editing && ed && ed.dataset.bid === ui.editing.biz.id) readEditor();
    root.innerHTML = heroHtml() + toolbarHtml()
      + `<main class="gutter"><div class="inner">${panelHtml()}${listHtml()}${joinHtml()}</div></main>`
      + `<footer class="gutter"><div class="inner">זה העסק שלנו · מאגר העסקים של מושב שדה אליעזר`
      + (ui.canEdit ? `<div class="admin-entry"><button class="btn small ghost" id="adminToggle" type="button">${ui.admin ? "סגירת הניהול" : "ניהול המאגר"}</button></div>` : "")
      + `</div></footer>`;
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (caret != null) el.setSelectionRange(caret, caret); } }
  }

  function readEditor() {
    const v = id => (document.getElementById(id) || {}).value ?? "";
    const b = ui.editing.biz;
    if (document.getElementById("e_offer")) Object.assign(b, { offer: v("e_offer").trim(), availability: v("e_availability").trim(), tools: v("e_tools").trim() });
    Object.assign(b, {
      kind: v("e_kind") || b.kind || "biz",
      bizName: v("e_bizName").trim(), profession: v("e_profession").trim(), categories: [...document.querySelectorAll("#e_cats input:checked")].map(i => i.value), category: "", ownerName: v("e_ownerName").trim(),
      description: v("e_description").trim(), discount: v("e_discount").trim(), phone: v("e_phone").trim(), phone2: v("e_phone2").trim(),
      email: v("e_email").trim(), website: v("e_website").trim(), social: v("e_social").trim(), instagram: v("e_instagram").trim(), otherContact: v("e_otherContact").trim(), area: v("e_area").trim(), hours: v("e_hours").trim(),
      bizAddress: v("e_bizAddress").trim(), location: v("e_location").trim(), farmNo: v("e_farmNo").trim(), years: v("e_years").trim(), license: v("e_license").trim(), contactPref: v("e_contactPref").trim(),
      showPrices: !!(document.getElementById("e_showPrices") || {}).checked,
      source: (document.getElementById("e_approved") || {}).checked ? "" : (b.source || ""),
      services: v("e_services").split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => { const i = l.lastIndexOf(" – ") > 0 ? l.lastIndexOf(" – ") : l.lastIndexOf(" - "); return i > 0 ? { name: l.slice(0, i).trim(), price: l.slice(i + 3).trim() } : { name: l, price: "" }; })
    });
  }

  // ---------- events ----------
  root.addEventListener("input", e => {
    if (e.target.id === "q") { ui.q = e.target.value; const m = root.querySelector("main .inner"); m.innerHTML = panelHtml() + listHtml() + joinHtml(); }
  });
  root.addEventListener("click", async e => {
    const t = e.target.closest("button, [data-cat]"); if (!t) return;
    if (t.dataset.cat !== undefined) { ui.cat = t.dataset.cat; render(); return; }
    if (t.dataset.kind !== undefined) { ui.kind = t.dataset.kind; ui.cat = ""; render(); return; }
    if (t.dataset.copy) {
      const val = t.dataset.copy;
      try { await navigator.clipboard.writeText(val); t.textContent = "הועתק"; }
      catch (_) { const span = t.parentElement.querySelector(".phone"); const r = document.createRange(); r.selectNodeContents(span); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "סומן"; }
      setTimeout(() => { t.textContent = "העתקה"; }, 1600); return;
    }
    if (t.id === "adminToggle") {
      ui.admin = !ui.admin; render();
      // the button lives in the footer, the panel at the top of the list
      const p = document.querySelector(".panel"); if (p) p.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (t.dataset.tab) { ui.tab = t.dataset.tab; render(); return; }
    if (t.id === "parseBtn") {
      const r = parseSummary(document.getElementById("paste").value);
      if (!r.found) { setStatus("לא זיהיתי סיכום של הטופס. העתיקו את כל תוכן המייל, או לחצו ״מילוי ידני״.", true); return; }
      ui.editing = { biz: r.biz, hidden: r.hidden, isNew: true }; setStatus("הפרטים נקראו. בדקו, הוסיפו תמונות ופרסמו."); render(); return;
    }
    if (t.id === "manualBtn") { ui.editing = { biz: blankBiz(), hidden: [], isNew: true }; ui.status = ""; render(); return; }
    if (t.id === "cancelEdit") { ui.editing = null; ui.status = ""; render(); return; }
    if (t.dataset.rmphoto !== undefined) { readEditor(); ui.editing.biz.photos.splice(+t.dataset.rmphoto, 1); render(); return; }
    if (t.dataset.edit) {
      const b = DATA.businesses.find(x => x.id === t.dataset.edit); if (!b) return;
      ui.editing = { biz: JSON.parse(JSON.stringify(b)), hidden: [], isNew: false }; ui.tab = "add"; ui.status = ""; render();
      document.querySelector(".panel").scrollIntoView({ block: "start" }); return;
    }
    if (t.dataset.del) { ui.confirmDel = t.dataset.del; render(); return; }
    if (t.dataset.delNo !== undefined) { ui.confirmDel = null; render(); return; }
    if (t.dataset.delYes) {
      const next = { ...DATA, businesses: DATA.businesses.filter(x => x.id !== t.dataset.delYes) };
      ui.confirmDel = null; await save(next, "העסק הוסר. הדף נטען מחדש…"); return;
    }
    if (t.id === "saveBiz") {
      readEditor(); const b = ui.editing.biz;
      if (!b.bizName) { setStatus("חסר שם עסק.", true); document.getElementById("e_bizName").focus(); return; }
      b.updatedAt = new Date().toISOString(); if (!b.addedAt) b.addedAt = b.updatedAt;
      const list = DATA.businesses.filter(x => x.id !== b.id); list.push(b);
      await save({ ...DATA, businesses: list }, ui.editing.isNew ? "העסק נוסף למאגר. הדף נטען מחדש…" : "השינויים נשמרו. הדף נטען מחדש…"); return;
    }
    if (t.dataset.clearlogo) { DATA.site[t.dataset.clearlogo] = ""; render(); setStatus("הלוגו יוסר אחרי ״שמירה ופרסום״."); return; }
    if (t.id === "saveSettings") {
      const site = { ...DATA.site, intro: document.getElementById("s_intro").value.trim(), formUrl: document.getElementById("s_formUrl").value.trim() };
      await save({ ...DATA, site }, "ההגדרות נשמרו. הדף נטען מחדש…"); return;
    }
  });
  root.addEventListener("change", async e => {
    const t = e.target;
    if (t.id === "e_kind") { readEditor(); render(); return; }
    if (t.id === "e_photos") {
      readEditor(); const b = ui.editing.biz;
      for (const f of t.files) { if (b.photos.length >= 4) break; if (!f.type.startsWith("image/")) continue; try { b.photos.push(await imageToDataURL(f, 1100, "image/jpeg", 0.78)); } catch (_) {} }
      render(); return;
    }
    if (t.id === "moshavLogoFile" || t.id === "brandLogoFile") {
      const f = t.files[0]; if (!f) return;
      try { DATA.site[t.id === "moshavLogoFile" ? "moshavLogo" : "brandLogo"] = await imageToDataURL(f, 600, "image/png"); render(); setStatus("הלוגו מוצג בתצוגה מקדימה. לחצו ״שמירה ופרסום״ כדי לשמור."); }
      catch (_) { setStatus("לא הצלחתי לקרוא את הקובץ. נסו PNG או JPG.", true); }
    }
  });

  render();

  // ---------- editors only: light up management ----------
  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [art, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
      if (!art || !user) return;
      const can = await user.canEdit();
      if (!can) return;
      artifactApi = art; ui.canEdit = true; render();
    } catch (_) {}
  })();
})();
</script>
